# CI — Incremento 16 (auditoria A-05 / A-08).
#
# Roda a suíte de testes e o ferramental de qualidade a cada push na `main`
# e em todo pull request pra `main`. Substitui o "autoteste manual" da
# etapa 4 do protocolo de incrementos (CLAUDE.md, seção 1.3) por uma
# barreira automática — um commit que quebre os testes fica visível aqui.
#
# NÃO condiciona o deploy do Render (autoDeploy continua ligado — decisão
# do dono do projeto, 2026-08-27). O gate de deploy entra num incremento
# posterior, quando o Deploy Hook do Render estiver configurado.
#
# Python 3.12.7: mesma versão do Render (ver render.yaml). O dev local
# ainda roda 3.9; a diferença é conhecida e o CI valida a versão que vai
# pra produção.
#
# Incremento 21 (auditoria A-04): além do `testes` (SQLite, rápido), dois
# jobs contra PostgreSQL — a suíte inteira (`testes-postgres`) e o
# round-trip das migrations (`migracoes-postgres`). Postgres é o banco de
# produção (Neon); CHECK constraint, tipo Numeric e semântica transacional
# diferem do SQLite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  testes-postgres:
    name: Testes (pytest contra PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passoca
          POSTGRES_PASSWORD: passoca
          POSTGRES_DB: passoca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py roda a suíte contra este banco quando TEST_DATABASE_URL
      # está setada (senão, SQLite em memória — o default local).
      TEST_DATABASE_URL: postgresql+psycopg://passoca:passoca@localhost:5432/passoca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  migracoes-postgres:
    name: Migrations (round-trip no PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passoca
          POSTGRES_PASSWORD: passoca
          POSTGRES_DB: passoca_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # env.py lê a URL do `settings.database_url`, que vem de DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://passoca:passoca@localhost:5432/passoca_mig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: sobe e desce a cadeia de migrations, depois sobe de novo
        # As migrations do projeto são escritas p/ Postgres (server default
        # `now()`) e nunca tinham sido executadas de verdade — só validadas
        # offline. Isto prova que sobem, descem e sobem de novo sem erro.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  qualidade:
    name: Qualidade (ruff, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: bandit (varredura de segurança do código)
        run: bandit -c pyproject.toml -r app

      - name: pip-audit (CVE em dependências)
        # Audita as dependências de produção (requirements.txt), não as de
        # desenvolvimento.
        #
        # A baseline auditada (2026-08-27) tinha 9 CVEs. O Incremento 16.1
        # subiu fastapi/starlette e corrigiu os 2 que tinham fix lançado E
        # nos afetavam (PYSEC-2026-1942: ReDoS no Range do StaticFiles;
        # PYSEC-2026-1941: multipart travando o event loop).
        #
        # Os 7 abaixo continuam ignorados — cada um por um destes motivos,
        # revisar a cada bump:
        #   PYSEC-2026-161 / -248 / -249  (starlette): fix só em starlette
        #     1.x, que ainda não foi lançado (última é 0.49.3). Não
        #     alcançável aqui: o código lê `request.url.path`, nunca
        #     `.hostname`/`.netloc`, e não parseia form urlencoded.
        #   PYSEC-2026-2280 (starlette): fix só em 1.1.0 (não lançado). Não
        #     usamos `HTTPEndpoint`.
        #   PYSEC-2026-2281 (starlette): idem; e é SSRF via caminho UNC no
        #     Windows — o Render roda Linux.
        #   PYSEC-2026-2270 (python-dotenv): fix é 1.2.2 (não lançado,
        #     última é 1.2.1). Só afeta `set_key`/`unset_key`; aqui só
        #     lemos o .env.
        #   PYSEC-2026-2132 (click): fix é 8.3.3 (não lançado, última é
        #     8.1.8). Injeção via `click.edit()`, que nada no projeto chama.
        #
        # Um CVE NOVO, fora desta lista, quebra o CI de propósito.
        run: >
          pip-audit -r requirements.txt --strict --desc
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2270
          --ignore-vuln PYSEC-2026-2132
