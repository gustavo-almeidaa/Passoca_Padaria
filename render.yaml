# Blueprint do Render — Incremento 13 (deploy).
#
# Deploy: no painel do Render, "New" -> "Blueprint" -> conectar este
# repositório. O Render lê este arquivo e pré-configura o serviço; os
# valores marcados `sync: false` ficam em branco de propósito — são
# segredos, você preenche direto no painel do Render (nunca aqui, nunca
# no chat).
#
# rootDir: backend/ porque é onde ficam requirements.txt e o pacote `app`
# (ver CLAUDE.md, seção 9, e README.md, "Estrutura do repositório").
services:
  - type: web
    name: passoca-padaria
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Sem isso, o Render usa a versão mais recente do Python (3.14 no
      # momento), tempo demais nova pra várias libs do projeto ainda
      # publicarem wheel pré-compilado (greenlet, por exemplo, falhava
      # tentando compilar do zero contra a API interna do CPython 3.14).
      # 3.12 é bem estabelecida e tem wheel pra tudo que este projeto usa.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
