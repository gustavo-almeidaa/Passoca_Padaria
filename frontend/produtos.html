<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padaria do Passoca — Encomendas</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <h1>🥐 Padaria do Passoca</h1>
  <p>sistema de encomendas</p>
  <nav>
    <a class="tab" href="/">Clientes</a>
    <a class="tab active" href="/produtos.html">Produtos</a>
    <a class="tab" href="/pedido.html">Novo Pedido</a>
    <span class="tab disabled" title="Em breve">Pedidos</span>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Cadastro de Produto</h2>
    <p class="sub">Registre os produtos disponíveis para encomenda.</p>

    <form id="form-produto" novalidate>
      <div class="row">
        <div>
          <label for="p-nome">Nome do produto</label>
          <input id="p-nome" name="nome" type="text" placeholder="Ex: Bolo de Chocolate">
        </div>
        <div>
          <label for="p-preco">Preço</label>
          <input id="p-preco" name="preco" type="number" step="0.01" min="0" placeholder="0,00">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="p-categoria">Categoria</label>
          <select id="p-categoria" name="categoria">
            <option value="" selected disabled>Selecione</option>
            <option value="pao">Pão</option>
            <option value="bolo">Bolo</option>
            <option value="salgado">Salgado</option>
            <option value="doce">Doce</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div>
          <label for="p-unidade">Unidade</label>
          <select id="p-unidade" name="unidade">
            <option value="" selected disabled>Selecione</option>
            <option value="unidade">Unidade</option>
            <option value="kg">Kg</option>
            <option value="duzia">Dúzia</option>
            <option value="cento">Cento</option>
          </select>
        </div>
      </div>
      <label class="checkbox-line" for="p-personalizavel">
        <input id="p-personalizavel" name="personalizavel" type="checkbox">
        Produto personalizável (ex: bolo de festa sob medida — exige sinal)
      </label>
      <button type="submit" class="action" id="botao-salvar-produto">Salvar Produto</button>
      <p id="feedback-produto" class="feedback" role="status" hidden></p>
    </form>
  </div>

  <div class="card">
    <h2>Produtos cadastrados</h2>
    <div id="lista-produtos" class="produto-list"></div>
  </div>
</main>

<footer>Padaria do Passoca — Incremento 7</footer>

<script src="/js/ui.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cadastro-produto.js"></script>
</body>
</html>
