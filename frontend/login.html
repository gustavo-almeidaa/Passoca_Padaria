<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padaria do Passoca — Entrar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>🥐 Padaria do Passoca</h1>
    <p class="sub">Entre com seu e-mail e senha.</p>
    <form id="form-login" novalidate>
      <label for="lg-email">E-mail</label>
      <input id="lg-email" name="email" type="email" placeholder="seu@email.com" autocomplete="username">
      <label for="lg-senha">Senha</label>
      <input id="lg-senha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit" class="action" id="botao-entrar">Entrar</button>
      <p id="feedback-login" class="feedback" role="status" hidden></p>
    </form>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/api.js"></script>
<script src="/js/login-page.js"></script>
</body>
</html>
