<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padaria do Passoca — Encomendas</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <h1>🥐 Padaria do Passoca</h1>
  <p>sistema de encomendas</p>
  <nav>
    <a class="tab" href="/">Clientes</a>
    <a class="tab" href="/produtos.html">Produtos</a>
    <a class="tab" href="/pedido.html">Novo Pedido</a>
    <a class="tab active" href="/pedidos.html">Pedidos</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Pedidos</h2>
    <p class="sub">Consulte os pedidos por período e avance o status de produção.</p>

    <form id="form-filtro" novalidate>
      <div class="row">
        <div>
          <label for="f-data-inicio">De</label>
          <input id="f-data-inicio" type="date">
        </div>
        <div>
          <label for="f-data-fim">Até (opcional)</label>
          <input id="f-data-fim" type="date">
        </div>
      </div>
      <button type="submit" class="action" id="botao-buscar">Buscar</button>
      <p id="feedback-pedidos" class="feedback" role="status" hidden></p>
    </form>
  </div>

  <div class="card">
    <div id="lista-pedidos" class="ticket-list"></div>
  </div>
</main>

<footer>Padaria do Passoca — Incremento 8</footer>

<script src="/js/ui.js"></script>
<script src="/js/api.js"></script>
<script src="/js/lista-pedidos.js"></script>
</body>
</html>
